spring:
  datasource:
    url: jdbc:h2:mem:ledgerflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        hbm2ddl:
          auto: none
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    listener:
      auto-startup: false
